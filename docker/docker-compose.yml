version: '3.8'

services:
  auraliss-update-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auraliss-update-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - GITHUB_OWNER=perfectmens
      - GITHUB_REPO=lokmangal
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
