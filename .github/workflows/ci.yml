name: Flutter CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Python for API Governance Validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python YAML Dependency
        run: pip install pyyaml

      - name: Validate API Governance Mapping
        run: python scripts/validate-api-mapping.py

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Run Static Analysis & Lints
        run: flutter analyze

      - name: Run Unit & Widget Tests
        run: flutter test

      - name: Build Verification (Debug APK)
        run: flutter build apk --debug
