name: Flutter CD Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Semantic Version (3 segments only: e.g. 0.0.1 — NOT 0.0.0.1)'
        required: true
        default: '0.0.1'
      version_code:
        description: 'Monotonic Version Code (leave empty to derive from git count)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Resolve Release Version
        id: versioning
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version_code }}" ]; then
            V_CODE="${{ github.event.inputs.version_code }}"
          else
            V_CODE=$(git rev-list --count HEAD)
            if [ "$V_CODE" -lt 1 ]; then V_CODE=1; fi
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V_NAME="${{ github.event.inputs.version_name }}"
          else
            V_NAME="${GITHUB_REF#refs/tags/v}"
          fi

          # Pubspec strict SemVer enforcement (must be exactly 3 segments)
          DOTS=$(echo "$V_NAME" | tr -cd '.' | wc -c)
          if [ "$DOTS" -ne 2 ]; then
            echo "❌ Invalid SemVer format '$V_NAME'. Must have exactly 3 segments (e.g. 0.0.1)"
            exit 1
          fi

          echo "version_name=$V_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$V_CODE" >> $GITHUB_OUTPUT
          echo "Building versionName: $V_NAME, versionCode: $V_CODE"

      - name: Prepare Signing Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_DEST="/tmp/signing.keystore"
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_DEST"
          elif [ -f "release.keystore" ]; then
            cp "release.keystore" "$KEYSTORE_DEST"
          else
            echo "❌ No release keystore found!"; exit 1
          fi
          KEYSTORE_SIZE=$(stat -c%s "$KEYSTORE_DEST")
          if [ "$KEYSTORE_SIZE" -lt 100 ]; then
            echo "❌ Keystore corrupt (size: ${KEYSTORE_SIZE} bytes)"; exit 1
          fi
          echo "keystore_path=$KEYSTORE_DEST" >> $GITHUB_OUTPUT

      - name: Install Dependencies
        run: flutter pub get

      - name: Set up Python for API Governance Validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python YAML Dependency
        run: pip install pyyaml

      - name: Validate API Governance Mapping
        run: python scripts/validate-api-mapping.py

      - name: Run Static Analysis & Lints
        run: flutter analyze

      - name: Run Unit & Widget Tests
        run: flutter test

      - name: Assemble Release APK
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --build-name="${{ steps.versioning.outputs.version_name }}" \
            --build-number="${{ steps.versioning.outputs.version_code }}"

      - name: Securely Wipe Keystore
        if: always()
        run: rm -f /tmp/signing.keystore

      - name: Package Artifacts & Calculate Checksums
        id: artifacts
        run: |
          VERSION="${{ steps.versioning.outputs.version_name }}"
          CODE="${{ steps.versioning.outputs.version_code }}"
          APK_SRC=$(find build/app/outputs/flutter-apk/ -name "*release*.apk" | head -n 1)
          if [ -z "$APK_SRC" ]; then
            echo "❌ Could not find release APK!"; exit 1
          fi
          APK_DEST="lokmangal-release-v${VERSION}.apk"
          cp "$APK_SRC" "$APK_DEST"

          APK_SHA256=$(sha256sum "$APK_DEST" | awk '{print $1}')

          CERT_FINGERPRINT="A6:4B:6D:FB:3C:5B:7F:A5:A0:A3:36:3F:AC:69:21:1D:4D:C0:C5:26:93:17:7E:64:29:0A:AB:E4:A0:F7:CB:59"

          cat <<EOF > version.json
          {
            "versionCode": ${CODE},
            "versionName": "${VERSION}",
            "apkFileName": "${APK_DEST}",
            "downloadUrl": "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/${APK_DEST}",
            "sha256": "${APK_SHA256}",
            "certificateFingerprint": "${CERT_FINGERPRINT}",
            "releaseNotes": "Release v${VERSION} (Build ${CODE}) - Lokmangal Telemetry and In-App Update Engine"
          }
          EOF

          echo "apk_path=$APK_DEST" >> $GITHUB_OUTPUT
          echo "apk_sha256=$APK_SHA256" >> $GITHUB_OUTPUT

      - name: Verify Signature with apksigner
        continue-on-error: true
        run: |
          APKSIGNER=$(find $ANDROID_HOME/build-tools/ -name "apksigner" | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose "${{ steps.artifacts.outputs.apk_path }}"
          else
            echo "apksigner not found in build tools, skipping signature verification step."
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release v${{ steps.versioning.outputs.version_name }}"
          tag_name: "v${{ steps.versioning.outputs.version_name }}"
          make_latest: true
          files: |
            ${{ steps.artifacts.outputs.apk_path }}
            version.json
          body: |
            ## Lokmangal Production Release v${{ steps.versioning.outputs.version_name }} (Build ${{ steps.versioning.outputs.version_code }})
            - **Binary:** `${{ steps.artifacts.outputs.apk_path }}`
            - **SHA-256 Checksum:** `${{ steps.artifacts.outputs.apk_sha256 }}`
            - **Signing Fingerprint:** `A6:4B:6D:FB:3C:5B:7F:A5:A0:A3:36:3F:AC:69:21:1D:4D:C0:C5:26:93:17:7E:64:29:0A:AB:E4:A0:F7:CB:59`
            - **Git Commit:** `${{ github.sha }}`
          draft: false
          prerelease: false
